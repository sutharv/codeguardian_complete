# CodeGuardian Configuration
# Copy to config.yaml and customize

server:
  host: "127.0.0.1"
  port: 8080
  debug: false
  workers: 4

# LLM Configuration
llm:
  provider: "anthropic"  # anthropic or openai
  model: "claude-sonnet-4-20250514"
  temperature: 0.1
  max_tokens: 4096
  # api_key: "sk-..."  # Use ANTHROPIC_API_KEY env var instead

# Security Scanners
scanners:
  bandit:
    enabled: true
    severity_threshold: "low"
    timeout_seconds: 60
  
  semgrep:
    enabled: true
    severity_threshold: "low"
    timeout_seconds: 120
    rules:
      - "p/security-audit"
      - "p/owasp-top-ten"
      - "p/secrets"

# Policy Engine
policy:
  enabled: true
  policy_path: "./configs/policies/"
  standards:
    - "OWASP_TOP_10"
    - "CWE_SANS_25"
    - "SECURE_CODING"

# Remediation
remediation:
  auto_suggest: true
  use_llm: true
  max_suggestions: 3

# Logging
logging:
  level: "INFO"
  format: "rich"

# IDE Integration
ide:
  debounce_ms: 500
  max_file_size_kb: 500
  excluded_patterns:
    - "node_modules/**"
    - "venv/**"
    - "**/*.min.js"
    - "**/dist/**"
