# CodeGuardian Docker Compose
version: '3.8'

services:
  codeguardian:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codeguardian-api
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - LLM_MODEL=${LLM_MODEL:-claude-sonnet-4-20250514}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - POLICY_PATH=/app/configs/policies/
    volumes:
      - ./configs:/app/configs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Optional: PostgreSQL for history
  postgres:
    image: postgres:15-alpine
    container_name: codeguardian-db
    environment:
      - POSTGRES_USER=codeguardian
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
      - POSTGRES_DB=codeguardian
    volumes:
      - postgres_data:/var/lib/postgresql/data
    profiles:
      - full

volumes:
  postgres_data:
